services:
  mongodb:
    image: mongo:7.0
    container_name: hsi-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hsi_tickets
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s
    networks:
      - hsi-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hsi-backend
    ports:
      - "8083:8080"
    env_file:          
      - ./backend/.env  
    environment:
      SERVER_PORT: 8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hsi-network

volumes:
  mongodb_data:

networks:
  hsi-network:
    driver: bridge